name: tests

on:
  pull_request:
  push:
    branches: [main]

jobs:
  pytest:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - run: python -m pip install -e ".[dev]" numpy opencv-python-headless
      - run: python -m pytest -q
        env:
          MC_TRACKER_HOME: ${{ runner.temp }}/mc-tracker

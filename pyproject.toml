[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "mc-tracker"
version = "0.1.0"
description = "Screen-reading EXP/loot tracker and price-check companion for MapleStory Classic"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
dependencies = [
    "PySide6>=6.7",
    "httpx>=0.27",
    "rapidfuzz>=3.9",
    "uiautomation>=2.0",
    "numpy>=1.26",  # session -> items (quickslot usage)
]

[project.optional-dependencies]
vision = [
    "windows-capture>=2.0",  # window_hwnd= needs 2.x
    "opencv-python>=4.10",
    "numpy>=1.26",
    "rapidocr>=3.0",
    "onnxruntime>=1.20",
]
dev = ["pytest>=8", "opencv-python>=4.10"]  # tests exercise vision/quickslots

[project.scripts]
mc-tracker = "mctracker.app:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.setuptools.package-data]
mctracker = ["res/*.svg"]

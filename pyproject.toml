[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "mc-tracker"
version = "0.1.0"
description = "Screen-reading EXP/loot tracker and price-check companion for MapleStory Classic"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
dependencies = [
    "PySide6>=6.7",
    "httpx>=0.27",
    "rapidfuzz>=3.9",
]

[project.optional-dependencies]
vision = [
    "windows-capture>=1.4",
    "opencv-python>=4.10",
    "numpy>=1.26",
    "rapidocr>=3.0",
    "onnxruntime>=1.20",
]
dev = ["pytest>=8"]

[project.scripts]
mc-tracker = "mctracker.app:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
